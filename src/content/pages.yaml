  title:
    en: "Agenda — Antonio Simón"
    es: "Agenda — Antonio Simón"
  eyebrow:
    en: "Agenda"
    es: "Agenda"
  display:
    en: "Agenda"
    es: "Agenda"
  lede:
    en: "Concerts, lecture-recitals and masterclasses."
    es: "Conciertos, conferencias-concierto y clases magistrales."
  metaDescription:
    en: "Upcoming concerts, lecture-recitals and masterclasses by pianist and fortepianist Antonio Simón."
    es: "Próximos conciertos, conferencias-concierto y clases magistrales del pianista y fortepianista Antonio Simón."
  note:
