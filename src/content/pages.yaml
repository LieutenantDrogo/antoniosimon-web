home:
  title:
    en: "Antonio Simón — pianist & fortepianist"
    es: "Antonio Simón — pianista y fortepianista"
  eyebrow:
    en: "Piano, fortepiano & historical keyboards"
    es: "Piano, fortepiano y teclados históricos"
  display:
    en: "Antonio Simón"
    es: "Antonio Simón"
  kicker:
    en: "Romanticism under altered light."
    es: "El Romanticismo, bajo otra luz."
  lede:
    en: "A nineteenth-century score is a compressed transmission: it assumed a grammar nobody needed to write down. Treatises, early recordings and reproducing piano rolls give part of that grammar back. They do not prescribe. They widen the space I play in."
    es: "Una partitura del siglo XIX es una transmisión comprimida: da por supuesta una gramática que nadie necesitaba escribir. Los tratados, las primeras grabaciones y los rollos de piano reproductor devuelven parte de esa gramática. No prescriben: ensanchan el espacio en el que toco."
  metaDescription:
    en: "Antonio Simón, pianist and fortepianist. The Classical and Romantic repertoire played in its own grammar, on period instruments and on the modern piano."
    es: "Antonio Simón, pianista y fortepianista. El repertorio clásico y romántico tocado en su propia gramática, con instrumentos de época y con piano moderno."
  cta:
    - label: { en: "Listen", es: "Escuchar" }
      page: listen
    - label: { en: "Programmes", es: "Programas" }
      page: programmes

manifesto:
  title:
    en: "Manifesto — Antonio Simón"
    es: "Manifiesto — Antonio Simón"
  eyebrow:
    en: "Manifesto"
    es: "Manifiesto"
  display:
    en: "Torniamo all’antico"
    es: "Torniamo all’antico"
  displayItalic: true
  lede:
    en: "Return to the old, and it will be progress. Verdi wrote it as advice to a young composer; it works just as well as a working method."
    es: "Volvamos a lo antiguo: será un progreso. Verdi se lo escribió a un joven compositor; funciona igual de bien como método de trabajo."
  metaDescription:
    en: "The clean, synchronised reading is a twentieth-century style, not the absence of style. A manifesto for playing Romantic music in its own documented grammar."
    es: "La lectura limpia y sincronizada es un estilo del siglo XX, no la ausencia de estilo. Un manifiesto para tocar la música romántica en su gramática documentada."

listen:
  title:
    en: "Listen — Antonio Simón"
    es: "Escuchar — Antonio Simón"
  eyebrow:
    en: "Listen"
    es: "Escuchar"
  display:
    en: "Listen first"
    es: "Escuchar primero"
  lede:
    en: "Two performances, two instruments, one grammar. The practice does not depend on the hardware — which is the whole point of putting these two side by side."
    es: "Dos interpretaciones, dos instrumentos, una sola gramática. La práctica no depende del instrumento, que es justamente lo que se juega al ponerlas una junto a otra."
  metaDescription:
    en: "Video performances and recordings by Antonio Simón: Schubert on fortepiano, Scriabin on modern piano, and the Liszt discography."
    es: "Vídeos y grabaciones de Antonio Simón: Schubert al fortepiano, Scriabin al piano moderno y la discografía lisztiana."
  reclistEyebrow:
    en: "Recordings & screen"
    es: "Grabaciones y pantalla"

programmes:
  title:
    en: "Programmes — Antonio Simón"
    es: "Programas — Antonio Simón"
  eyebrow:
    en: "Programmes"
    es: "Programas"
  display:
    en: "Programmes that travel"
    es: "Programas que viajan"
  lede:
    en: "Five programmes built as finished objects: a title, an argument, and the instrument each one wants. All of them travel — on period instruments where a hall can host them, on the modern piano where it cannot. The argument survives the change."
    es: "Cinco programas concebidos como objetos acabados: un título, un argumento y el instrumento que cada uno pide. Todos viajan: con instrumentos de época cuando la sala puede acogerlos, con piano moderno cuando no. El argumento sobrevive al cambio."
  metaDescription:
    en: "Five touring recitals and lecture-recitals: Beethoven op. 111, the Romantic pedal, Beethoven and Schubert's last sonatas, Liszt solo and Liszt for cello and piano."
    es: "Cinco recitales y conferencias-concierto de gira: Beethoven op. 111, el pedal romántico, las últimas sonatas de Beethoven y Schubert, Liszt a solo y Liszt para violonchelo y piano."
  notebox:
    en: "Repertoire, duration and instrument are settled for each engagement, and the lecture-recitals can be given in English or Spanish. Two fortepianos can travel to the hall — an original Leschen of 1830 and a Graf copy by Paul McNulty — where that is useful. Where it is not, everything here works on a good modern piano."
    es: "El repertorio, la duración y el instrumento se acuerdan para cada propuesta, y las conferencias-concierto pueden ofrecerse en español o en inglés. Dos fortepianos pueden desplazarse a la sala —un Leschen original de 1830 y una copia de Graf de Paul McNulty— cuando resulte útil. Cuando no, todo lo anterior funciona en un buen piano moderno."

