    es: "Algunas salas y enlaces de los organizadores se anuncian más tarde que la propia fecha. Para la agenda actualizada, o para proponer una, escríbame."

research:
  title:
    en: "Research — Antonio Simón"
    es: "Investigación — Antonio Simón"
  eyebrow:
    en: "Research"
    es: "Investigación"
  display:
    en: "The evidence"
    es: "Las fuentes"
  lede:
    en: "Treatises give a prescriptive horizon; early recordings and reproducing piano rolls give a behavioural one, contaminated by seventy years of drift. The grammar is what has to be true for both of them to make sense as a single tradition."
    es: "Los tratados marcan un horizonte prescriptivo; las primeras grabaciones y los rollos de piano reproductor, uno conductual, contaminado por setenta años de deriva. La gramática es lo que debe ser cierto para que ambos tengan sentido como una sola tradición."
  metaDescription:
    en: "Research on Romantic pedalling, early recordings, reproducing piano rolls and performance as drama — presented in Vienna, Bern, Ghent, Cornell and Stanford."
    es: "Investigación sobre el pedal romántico, las primeras grabaciones, los rollos de piano reproductor y la interpretación como drama — presentada en Viena, Berna, Gante, Cornell y Stanford."
  note:
    en: "For texts, a lecture invitation or an academic collaboration, write to me directly."
    es: "Para textos, una invitación a dar una conferencia o una colaboración académica, escríbame directamente."

